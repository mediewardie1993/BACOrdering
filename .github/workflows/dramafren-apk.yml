name: Build DramaFren APK
on:
  push:
    paths: ['dramafren-app/**', '.github/workflows/dramafren-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dramafren-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with: { name: DramaFren-apk, path: dramafren-app/app/build/outputs/apk/release/*.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: dramafren-v${{ github.run_number }}
          name: DramaFren APK ${{ github.run_number }}
          files: dramafren-app/app/build/outputs/apk/release/*.apk
    permissions: { contents: write }
