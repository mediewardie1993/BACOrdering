name: Build Medward Lyrics Flasher

on:
  workflow_dispatch:
  push:
    paths:
      - 'medward-lyrics-flasher/**'
      - '.github/workflows/build-lyrics-flasher.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: medward-lyrics-flasher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Medward-Lyrics-Flasher-exe
          path: medward-lyrics-flasher/dist/Medward-Lyrics-Flasher.exe
